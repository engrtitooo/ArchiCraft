<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiCraft — AI-Powered Architectural &amp; Interior Design Concepts</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Merriweather:wght@300;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">

    <!-- Tailwind via CDN (consistent with original project setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              arch: {
                50: '#f9fafb',
                100: '#f3f4f6',
                500: '#6b7280',
                800: '#1f2937',
                900: '#111827',
              },
              accent: {
                light: '#fdba74',
                DEFAULT: '#f97316',
                dark: '#c2410c',
              }
            }
          },
        },
      }
    </script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
      }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- PROFESSIONAL PRINT STYLES --- */
      @media print {
        @page { margin: 10mm; size: A4; }
        body { background-color: white; color: black; font-size: 12pt; }
        header, footer, button, .no-print, nav, .info-modal-backdrop { display: none !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .print-only { display: block !important; }
        .screen-only { display: none !important; }
        .print-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 20px !important; }
        .page-break { page-break-before: always; }
        .avoid-break { page-break-inside: avoid; }
        h1 { font-size: 24pt !important; color: #111827 !important; }
        h2 { font-size: 18pt !important; color: #111827 !important; border-bottom: 2px solid #eee; margin-bottom: 10px; }
        h3 { font-size: 14pt !important; color: #374151 !important; margin-top: 15px; }
        p { line-height: 1.5; color: #4b5563 !important; }
      }
      .print-only { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite entry point — bundles AccessGate + App -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
